    <text x="750" y="226" fill="#191919" font-family="Courier New, monospace" font-size="17" font-weight="400">01</text>
    <text x="795" y="226" fill="#191919" font-family="Courier New, monospace" font-size="21" font-weight="700">const pack = {</text>
    <text x="750" y="269" fill="#191919" font-family="Courier New, monospace" font-size="17" font-weight="400">02</text>
