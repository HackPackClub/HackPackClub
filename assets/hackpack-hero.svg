<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="586" viewBox="0 0 1200 586" role="img" aria-labelledby="title desc">
  <title id="title">HackPack Club</title>
  <desc id="desc">Neo-brutalist club poster. Code together. Grow together. All skill levels welcome. Established 2026.</desc>
  <rect x="10" y="10" width="1180" height="566" fill="#191919" stroke="#191919" stroke-width="3"/>
