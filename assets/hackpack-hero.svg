  <rect x="2" y="2" width="1180" height="58" fill="#ffde59" stroke="#191919" stroke-width="3"/>
  <text x="26" y="39" fill="#191919" font-family="Courier New, monospace" font-size="25" font-weight="700">H / P</text>
  <text x="154" y="38" fill="#191919" font-family="Courier New, monospace" font-size="19" font-weight="700">A STUDENT CODING COMMUNITY</text>
  <text x="999" y="38" fill="#191919" font-family="Courier New, monospace" font-size="19" font-weight="700">EST. 2026</text>
  <text x="42" y="213" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="126" font-weight="900" letter-spacing="-7">HACKPACK</text>
  <text x="42" y="343" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="142" font-weight="900" letter-spacing="-6">CLUB</text>
  <text x="431" y="343" fill="#ff8c69" font-family="Arial, Helvetica, sans-serif" font-size="142" font-weight="900">.</text>
  <text x="48" y="400" fill="#191919" font-family="Courier New, monospace" font-size="25" font-weight="700">CODE TOGETHER.</text>
  <text x="48" y="435" fill="#191919" font-family="Courier New, monospace" font-size="25" font-weight="700">GROW TOGETHER.</text>
  <rect x="48" y="478" width="222" height="44" fill="#b9e6ce" stroke="#191919" stroke-width="3"/>
