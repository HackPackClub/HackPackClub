    <text x="811" y="312" fill="#191919" font-family="Courier New, monospace" font-size="21" font-weight="700">ideas: "unlimited"</text>
    <text x="750" y="355" fill="#191919" font-family="Courier New, monospace" font-size="17" font-weight="400">04</text>
    <text x="795" y="355" fill="#191919" font-family="Courier New, monospace" font-size="21" font-weight="700">};</text>
    <rect x="747" y="379" width="346" height="28" fill="#fffdf5" stroke="#191919" stroke-width="2"/>
    <text x="759" y="399" fill="#191919" font-family="Courier New, monospace" font-size="16" font-weight="700">&gt; let's make something.</text>
